<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Slayt Çalışma Merkezi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>:root{--bg:#f6f7f9;--fg:#1b2430;--card:#fff;--bd:#dde1e7;--ac:#0f766e;--mut:#667085;--ok:#e6f6ee;--bad:#fde8e8}@media(prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#e8ecf1;--card:#18202a;--bd:#2b3644;--ac:#2dd4bf;--mut:#9aa5b4;--ok:#12332b;--bad:#3a1d1d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:900px;margin:0 auto;padding:14px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}input,select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);min-height:44px}button.a{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:28px;text-align:center}#drop.on{border-color:var(--ac)}.m{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
progress{width:100%}.q{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}.ok{background:var(--ok)}.bad{background:var(--bad)}.tag{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-right:4px}.warn{border-left:4px solid #d97706;padding-left:8px}
#card{width:794px;height:1123px;background:#fff;color:#111;padding:28px;font:15px/1.35 Arial,sans-serif;overflow:hidden;position:relative}#card h2{margin:0 0 8px;font-size:1.5em;color:#0f766e}#card h3{margin:10px 0 3px;font-size:1.05em;border-bottom:2px solid #0f766e}#card ul{margin:0;padding-left:18px}#card table{border-collapse:collapse;width:100%}#card td,#card th{border:1px solid #999;padding:2px 5px;text-align:left}#card .kw span{display:inline-block;background:#d1fae5;border-radius:4px;padding:1px 6px;margin:2px}#card .ek{background:#fef3c7;padding:4px 8px;margin-top:8px}.wrap{overflow:auto;border:1px solid var(--bd)}</style></head><body><main>
<h1>Slayt Çalışma Merkezi</h1><div class="p"><label>Parola: <input type="password" id="pw" autocomplete="current-password"></label></div>
<div class="p"><div id="drop"><p><b>Slaytı sürükleyin veya seçin</b> (.pdf / .pptx, en fazla 100 MB)</p><input type="file" id="f" accept=".pdf,.pptx"></div><div id="st" class="m"></div><progress id="pr" max="100" value="0" hidden></progress><div class="row"><button id="retry" hidden>Yüklemeyi yeniden dene</button></div></div>
<div class="p" id="acts" hidden><b>Ne yapmak istersiniz?</b><div class="row"><button class="a" id="bA">A · İlgili çıkmış sorular</button><button class="a" id="bB">B · Tek sayfalık tekrar</button></div>
<div class="row"><button class="a" id="bC">C · Hoca tarzında quiz</button><select id="n"><option>5</option><option>10</option><option>20</option></select> soru <input id="hoca" placeholder="Hoca adı (isteğe bağlı)"></div></div>
<div id="out"></div></main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=i=>document.getElementById(i),MAX=100*1048576;let slides=[],file=null,busy=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say=t=>$("st").textContent=t, fullText=()=>slides.map(s=>`[Slayt ${s.n}] ${s.title}\n${s.text}`).join("\n\n");
async function api(p,b){const r=await fetch("/api/"+p,{method:"POST",headers:{"content-type":"application/json","x-app-password":$("pw").value},body:JSON.stringify(b)});const j=await r.json().catch(()=>({error:"Sunucu yanıtı okunamadı"}));if(!r.ok)throw new Error(j.error||r.status);return j}
async function extract(f){slides=[];if(/\.pdf$/i.test(f.name)){const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=d.numPages;i++){const t=(await(await d.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ").replace(/\s+/g," ").trim();slides.push({n:i,title:t.split(/(?<=[.!?:])\s/)[0].slice(0,80),text:t});say(`Metin çıkarılıyor: ${i}/${d.numPages}`)}}
 else{const z=await JSZip.loadAsync(f);const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)-b.match(/\d+/));let i=0;for(const n of names){const x=await z.files[n].async("string");const t=[...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]);slides.push({n:++i,title:(t[0]||"").slice(0,80),text:t.join(" ")})}}
 const chars=slides.reduce((a,s)=>a+s.text.length,0);if(chars<200)throw new Error("Slaytta okunabilir metin yok (taranmış/görsel olabilir). OCR bu sürümde sunucuda yapılandırılmadı.");}
function upload(f){return new Promise(async(res,rej)=>{try{const p=await api("presign",{name:f.name,size:f.size,type:f.type});const x=new XMLHttpRequest();x.open("PUT",p.url);x.setRequestHeader("content-type",p.contentType);$("pr").hidden=false;
 x.upload.onprogress=e=>{$("pr").value=e.loaded/e.total*100;say(`Yükleniyor: %${Math.round(e.loaded/e.total*100)}`)};x.onload=()=>x.status<300?res(p.key):rej(new Error("Depolama reddetti ("+x.status+")"));x.onerror=()=>rej(new Error("Ağ hatası"));x.send(f)}catch(e){rej(e)}})}
async function go(f){if(busy)return;if(!/\.(pdf|pptx)$/i.test(f.name))return say("Yalnızca .pdf veya .pptx");if(f.size>MAX)return say("Dosya 100 MB sınırını aşıyor");file=f;busy=true;$("acts").hidden=true;$("retry").hidden=true;
 try{await extract(f)}catch(e){busy=false;return say("Hata: "+e.message)}
 try{const k=await upload(f);say(`Hazır: ${slides.length} slayt okundu, dosya depolandı (${k}).`)}catch(e){say(`Dosya depolanamadı (${e.message}); slayt metni okundu, analiz depolamasız sürebilir.`);$("retry").hidden=false}
 busy=false;$("acts").hidden=false}
$("f").onchange=e=>e.target.files[0]&&go(e.target.files[0]);$("retry").onclick=()=>file&&go(file);
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("on")};$("drop").ondragleave=()=>$("drop").classList.remove("on");$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("on");e.dataTransfer.files[0]&&go(e.dataTransfer.files[0])};
async function run(btn,fn){btn.disabled=true;$("out").innerHTML='<div class="p">Çalışıyor…</div>';try{await fn()}catch(e){$("out").innerHTML=`<div class="p bad">Hata: ${esc(e.message)}</div>`}btn.disabled=false}
const lv={yuksek:"Yüksek",orta:"Orta",dusuk:"Düşük"};
$("bA").onclick=()=>run($("bA"),async()=>{const r=await api("match",{slides});window._res=r.results;
 $("out").innerHTML=`<div class="p"><b>GERÇEK ÇIKMIŞ SORULAR</b> — ${r.count} eşleşme. <span class="m">${esc(r.method)}</span>${r.count?'<div class="row"><button class="a" id="dl">Tümünü PDF yap</button></div>':'<p>Bu slayt için soru bankasında ilgili çıkmış soru bulunamadı.</p>'}</div>`+r.results.map(q=>`<div class="q"><span class="tag">${lv[q.level]}</span><span class="tag">${esc(q.exam_year)}</span><span class="tag">${esc(q.hoca||"hoca yok")}</span><span class="tag">${esc(q.source_pdf)} s.${q.source_page}</span><div class="m">Slayt: ${q.slide?`${q.slide.n}. slayt – ${esc(q.slide.title)}`:"—"} · ortak terimler: ${esc(q.matched_terms.join(", "))}</div><div><b>${esc(q.stem)}</b></div>${Object.entries(q.options).map(([k,v])=>`<div>${k}) ${esc(v)}</div>`).join("")}<details><summary>Cevap</summary>${q.answer||"Kaynakta yok"}</details></div>`).join("");
 if($("dl"))$("dl").onclick=()=>{const w=open("","_blank");w.document.write(`<!doctype html><meta charset=utf-8><title>İlgili çıkmış sorular</title><style>body{font:12pt Georgia,serif;margin:16mm}.q{break-inside:avoid;margin-bottom:12pt}.m{font:9pt sans-serif;color:#555}</style><h1>İlgili çıkmış sorular</h1>`+r.results.map((q,i)=>`<div class=q><div class=m>${i+1}. ${esc(q.exam_year)} · ${esc(q.hoca||"")} · ${esc(q.source_pdf)} s.${q.source_page} · ilişki: ${lv[q.level]}</div><b>${esc(q.stem)}</b>${Object.entries(q.options).map(([k,v])=>`<div>${k}) ${esc(v)}</div>`).join("")}<div class=m>Cevap: ${q.answer||"—"}</div></div>`).join("")+`<script>onload=()=>print()<\/script>`);w.document.close()}});
$("bB").onclick=()=>run($("bB"),async()=>{const s=await api("summary",{text:fullText()});const L=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
 const T=s.tablo&&s.tablo.satirlar?.length?`<h3>Tablo</h3><table><tr>${s.tablo.basliklar.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${s.tablo.satirlar.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`:"";
 $("out").innerHTML=`<div class="p"><div class="row"><button class="a" id="png">PNG indir</button><button id="pdfb">PDF olarak kaydet</button></div><div class="m" id="fit"></div></div><div class="wrap"><div id="card"><h2>${esc(s.baslik||"Son gün tekrar")}</h2><h3>Hap bilgiler</h3><ul>${L(s.hap_bilgiler)}</ul><h3>Keywords</h3><div class="kw">${(s.keywords||[]).map(k=>`<span>${esc(k)}</span>`).join("")}</div>${(s.ayirt_edici||[]).length?`<h3>Ayırt edici özellikler</h3><ul>${s.ayirt_edici.map(x=>`<li><b>${esc(x.a)}</b> ↔ <b>${esc(x.b)}</b>: ${esc(x.fark)}</li>`).join("")}</ul>`:""}${(s.karistirilanlar||[]).length?`<h3>Karıştırılanlar</h3><ul>${L(s.karistirilanlar)}</ul>`:""}${T}${(s.kodlamalar||[]).length?`<h3>Kodlamalar</h3><ul>${L(s.kodlamalar)}</ul>`:""}${(s.ek_bilgi||[]).length?`<div class="ek"><b>Slayt dışı ek bilgi (yapay zekâ):</b><ul>${L(s.ek_bilgi)}</ul></div>`:""}</div></div>`;
 const c=$("card");let fs=15;while(c.scrollHeight>c.clientHeight+1&&fs>9){fs-=.5;c.style.fontSize=fs+"px"}
 $("fit").textContent=c.scrollHeight>c.clientHeight+1?"UYARI: içerik tek sayfaya sığmadı, kesilmiş olabilir.":`Tek sayfaya sığdı (yazı boyutu ${fs}px).`;
 $("png").onclick=async()=>{const cv=await html2canvas(c,{scale:2,backgroundColor:"#fff"});const a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="tekrar.png";a.click()};
 $("pdfb").onclick=()=>{const w=open("","_blank");w.document.write(`<!doctype html><meta charset=utf-8><style>@page{size:A4;margin:0}body{margin:0}${document.querySelector("style").textContent.match(/#card[^}]*}/g).join("")}</style>`+c.outerHTML+`<script>onload=()=>print()<\/script>`);w.document.close()}});
$("bC").onclick=()=>run($("bC"),async()=>{const r=await api("quiz",{text:fullText(),n:+$("n").value,hoca:$("hoca").value.trim()});window._quiz=r.questions;const ans={};
 const draw=()=>{const done=r.questions.every((_,i)=>ans[i]);let h=`<div class="p warn"><b>${esc(r.label)}</b><br>İstenen ${r.requested}, üretilen ${r.produced}${r.produced<r.requested?" (yeterli güvenilir içerik olmadığı için daha az)":""}.</div>`;
  r.questions.forEach((q,i)=>{h+=`<div class="q ${done?(ans[i]===q.answer?"ok":"bad"):""}"><b>${i+1}. ${esc(q.stem)}</b>${Object.entries(q.options).map(([k,v])=>`<div><label><input type="radio" name="q${i}" value="${k}" ${ans[i]===k?"checked":""} ${done?"disabled":""}> ${k}) ${esc(v)}</label></div>`).join("")}${done?`<div class="m">Doğru: ${q.answer}. ${esc(q.explanation)}<br>Slayt dayanağı: ${esc(q.slide_basis||"")}</div>`:""}</div>`});
  if(done){const d=r.questions.filter((q,i)=>ans[i]===q.answer).length;h=`<div class="p"><b>Sonuç:</b> ${d} doğru, ${r.questions.length-d} yanlış, %${Math.round(d/r.questions.length*100)}</div>`+h}
  else h+='<div class="row"><button class="a" id="fin">Quiz\'i bitir ve sonucu gör</button></div>';
  $("out").innerHTML=h;$("out").querySelectorAll("input[type=radio]").forEach(x=>x.onchange=e=>ans[+x.name.slice(1)]=e.target.value);if($("fin"))$("fin").onclick=()=>{if(r.questions.some((_,i)=>!ans[i]))return alert("Tüm soruları işaretleyin.");draw()}};draw()});
</script></body></html>
